spring.application.name=student-management
server.port=8080

# ---- MySQL (database is created automatically if missing) ----
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pass123

# ---- JPA / Hibernate (creates users, students, blacklisted_tokens tables) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- JWT ----
# Secret must be at least 32 characters. Change it for any real deployment.
jwt.secret=ChangeThisSecretKey_AtLeast32Characters_Long_123456
# Token validity: 1 hour
jwt.expiration-ms=3600000
